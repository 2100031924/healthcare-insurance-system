spring.application.name=healthcare-insurance-system
server.port=${SERVER_PORT:8080}

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/healthcare_insurance?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:2004}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.data.web.pageable.default-page-size=20
spring.data.web.pageable.max-page-size=100

springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.display-request-duration=true

app.jwt.secret=${JWT_SECRET:healthcare-insurance-system-default-jwt-secret-change-me-2026}
app.jwt.issuer=healthcare-insurance-system
app.jwt.access-token-expiration-minutes=${JWT_ACCESS_EXPIRATION_MINUTES:60}
app.jwt.refresh-token-expiration-days=${JWT_REFRESH_EXPIRATION_DAYS:7}

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:8080}

app.bootstrap-admin.username=${ADMIN_USERNAME:admin}
app.bootstrap-admin.email=${ADMIN_EMAIL:admin@healthcare.com}
app.bootstrap-admin.password=${ADMIN_PASSWORD:Admin@12345}
app.bootstrap-admin.full-name=${ADMIN_FULL_NAME:System Administrator}

app.demo-data.enabled=${DEMO_DATA_ENABLED:false}
app.scheduling.enabled=${SCHEDULING_ENABLED:true}

logging.level.root=INFO
logging.level.com.healthcare.claimsystem=INFO
