spring.datasource.url=jdbc:h2:mem:healthcare_test;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

app.jwt.secret=test-secret-key-for-healthcare-insurance-system-2026
app.jwt.issuer=healthcare-insurance-system
app.jwt.access-token-expiration-minutes=60
app.jwt.refresh-token-expiration-days=7

app.cors.allowed-origins=http://localhost:3000

app.bootstrap-admin.username=admin
app.bootstrap-admin.email=admin@healthcare.com
app.bootstrap-admin.password=Admin@12345
app.bootstrap-admin.full-name=System Administrator

app.demo-data.enabled=false
app.scheduling.enabled=false

logging.level.root=WARN
logging.level.com.healthcare.claimsystem=INFO
